name: Database schema
on:
  push:
    paths: ['supabase/**', '.github/workflows/db.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - name: Apply schema and run behaviour checks
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/test-stub.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/002-grants.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/003-invite-only.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/004-admin.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/005-garage.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/006-groups.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/007-shared-pins.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/008-vehicle-color.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/009-badges.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/010-seed-badge-trails.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/011-rider-backup.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/012-group-messages.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/013-message-replies.sql
          psql -v ON_ERROR_STOP=1 -f supabase/test.sql
          psql -v ON_ERROR_STOP=1 -f supabase/test-admin.sql
          psql -v ON_ERROR_STOP=1 -f supabase/test-garage.sql
          psql -v ON_ERROR_STOP=1 -f supabase/test-groups.sql
          psql -v ON_ERROR_STOP=1 -f supabase/test-shared-pins.sql
          psql -v ON_ERROR_STOP=1 -f supabase/test-badges.sql
          psql -v ON_ERROR_STOP=1 -f supabase/test-rider-backup.sql
          psql -v ON_ERROR_STOP=1 -f supabase/test-group-messages.sql
