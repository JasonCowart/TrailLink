name: Supabase project
# Changes the live TrailLink database and sign-in settings with the SUPABASE_ACCESS_TOKEN secret.
# Prints only counts and yes/no settings (this repo is public).
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'test-backup = live test of rider backup with throwaway accounts; status = look only; setup = apply database changes and sign-in settings; test-email = send the admin a sign-in email'
        type: choice
        options: [status, setup, test-email, test-backup]
        default: status

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Before
        run: node scripts/supabase-admin.mjs status
      - name: Apply database changes
        if: inputs.action == 'setup'
        run: |
          node scripts/supabase-admin.mjs sql supabase/002-grants.sql
          node scripts/supabase-admin.mjs sql supabase/003-invite-only.sql
          node scripts/supabase-admin.mjs sql supabase/004-admin.sql
          node scripts/supabase-admin.mjs sql supabase/005-garage.sql
          node scripts/supabase-admin.mjs sql supabase/006-groups.sql
          node scripts/supabase-admin.mjs sql supabase/007-shared-pins.sql
          node scripts/supabase-admin.mjs sql supabase/008-vehicle-color.sql
          node scripts/supabase-admin.mjs sql supabase/009-badges.sql
          node scripts/supabase-admin.mjs sql supabase/010-seed-badge-trails.sql
          node scripts/supabase-admin.mjs sql supabase/011-rider-backup.sql
          node scripts/supabase-admin.mjs sql supabase/012-group-messages.sql
      - name: Sign-in settings
        if: inputs.action == 'setup'
        run: node scripts/supabase-admin.mjs auth
      - name: After
        if: inputs.action == 'setup'
        run: node scripts/supabase-admin.mjs status
      - name: Send the admin a test sign-in email
        if: inputs.action == 'test-email'
        run: node scripts/supabase-admin.mjs test-email
      - name: Live backup test
        if: inputs.action == 'test-backup'
        run: |
          cd web && npm install --silent && npm i --no-save --silent fake-indexeddb tsx && cd ..
          node scripts/test-backup.mjs
