name: Trail data
# Downloads Forest Service, BLM and OpenStreetMap routes for the launch states, packages them as map tiles,
# and stores them on the trail-data branch. The web app build copies them in. Runs weekly and on demand.
on:
  workflow_dispatch:
    inputs:
      states:
        description: 'States (comma separated)'
        default: 'CO,UT'
  schedule:
    - cron: '17 9 * * 1' # Mondays 09:17 UTC

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      STATES: ${{ github.event.inputs.states || 'CO,UT' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install osmium and tippecanoe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool build-essential libsqlite3-dev zlib1g-dev > /dev/null
          git clone -q --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -s -C /tmp/tippecanoe -j"$(nproc)" > /dev/null
          sudo make -s -C /tmp/tippecanoe install > /dev/null
          tippecanoe --version

      - name: OpenStreetMap tracks and OHV ways
        run: |
          mkdir -p data/out
          for st in ${STATES//,/ }; do
            case "$st" in
              CO) name=colorado ;; UT) name=utah ;; AZ) name=arizona ;; NV) name=nevada ;; NM) name=new-mexico ;; WY) name=wyoming ;; ID) name=idaho ;; *) echo "unknown state $st"; exit 1 ;;
            esac
            curl -sSfL --retry 6 --retry-all-errors --retry-delay 20 -o "/tmp/$name.osm.pbf" "https://download.geofabrik.de/north-america/us/$name-latest.osm.pbf"
            osmium tags-filter -O -o "/tmp/$name-ohv.osm.pbf" "/tmp/$name.osm.pbf" \
              w/highway=track w/atv=yes,designated,permissive w/ohv=yes,designated,permissive
            osmium export -O -f geojsonseq --geometry-types=linestring -o "/tmp/$name-ohv.geojsonseq" "/tmp/$name-ohv.osm.pbf"
          done
          cat /tmp/*-ohv.geojsonseq > data/out/osm.geojsonseq
          wc -l data/out/osm.geojsonseq

      - name: Forest Service and BLM routes
        run: node data/build-trails.mjs --states "$STATES" --osm data/out/osm.geojsonseq

      - name: Package as map tiles
        run: |
          tippecanoe -q -f -e data/out/tiles -l trails -Z5 -z12 \
            --no-tile-compression --drop-densest-as-needed --extend-zooms-if-still-dropping \
            --simplification=4 --name "TrailLink trails" data/out/trails.geojsonseq
          cp data/out/meta.json data/out/tiles/meta.json
          echo "tiles: $(find data/out/tiles -name '*.pbf' | wc -l) files, $(du -sh data/out/tiles | cut -f1)"

      - name: Save on the trail-data branch
        run: |
          cd data/out/tiles
          git init -q -b trail-data
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Trail data for $STATES, built $(date -u +%F)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" trail-data

      - name: Rebuild and publish the web app with the new data
        run: gh workflow run web.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
