<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4D3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TrailLink">
<meta name="description" content="Trail maps for UTV and ATV riders: topo, satellite and legal OHV routes, with offline maps and ride recording.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="icon" href="./icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>TrailLink</title>
</head>
<body>
<div id="app">
  <main id="mapwrap">
    <div id="map" role="application" aria-label="Trail map"></div>
    <div class="chips" id="chips"></div>
    <div class="fabs">
      <button id="btn-layers" class="fab" aria-label="Trail layers and colors">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 13 9 5 9-5"/></svg>
      </button>
      <button id="btn-base" class="fab" aria-label="Base map and offline maps">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20Z"/><path d="M9 4v13.5M15 6.5V20"/></svg>
      </button>
      <button id="btn-center" class="fab" aria-label="Center on me">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
      </button>
      <button id="btn-legend" class="fab" aria-label="Map legend">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h3M4 12h3M4 18h3"/><path d="M10 6h10M10 12h10M10 18h10" stroke-dasharray="2.5 2"/></svg>
      </button>
      <button id="btn-riders" class="fab" aria-label="Group riders">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c2.8.3 5 2.6 5 5.8"/></svg>
      </button>
    </div>
    <button id="btn-report" aria-label="Report something on the trail"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 22 20H2z"/><path d="M12 9v5M12 17v.01"/></svg><small>Report</small></button>
    <button id="btn-sos" aria-label="SOS. Press and hold for 3 seconds"><span>SOS<small>hold 3s</small></span></button>
    <div id="toast" role="status" aria-live="polite" hidden></div>
  </main>

  <aside id="panel">
    <nav id="tabs" role="tablist">
      <button role="tab" data-tab="ride">Ride</button>
      <button role="tab" data-tab="trails">Trails</button>
      <button role="tab" data-tab="garage">Garage</button>
      <button role="tab" data-tab="badges">Badges</button>
      <button role="tab" data-tab="pins">Pins</button>
      <button role="tab" data-tab="group">Group</button>
      <button id="panel-toggle" aria-label="Show or hide the panel" aria-expanded="false"><span aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></span></button>
    </nav>
    <section id="pane" role="tabpanel"></section>
  </aside>
</div>

<div id="gate" hidden>
  <div class="gate-card">
    <svg viewBox="0 0 100 100" class="gate-logo" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#1F4D3A"/><g transform="translate(12 13) scale(0.76)"><g fill="none" stroke="#6E9C84" stroke-width="2.4" stroke-linecap="round"><path d="M14 86 C 34 80, 66 80, 86 86"/><path d="M24 93 C 40 89, 60 89, 76 93"/></g><path d="M8 74 L30 40 L44 58 L60 26 L80 56 L92 46" fill="none" stroke="#E8501A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="30" cy="40" r="4.6" fill="#1F4D3A" stroke="#E8501A" stroke-width="3"/><circle cx="44" cy="58" r="4.6" fill="#1F4D3A" stroke="#E8501A" stroke-width="3"/><circle cx="80" cy="56" r="4.6" fill="#1F4D3A" stroke="#E8501A" stroke-width="3"/><path transform="translate(60 22) scale(1.15)" d="M0 0 C 0 0, -8 -9, -8 -15 A 8 8 0 0 1 8 -15 C 8 -9, 0 0, 0 0 Z" fill="#FFFFFF"/><circle cx="60" cy="4.75" r="3.45" fill="#1F4D3A"/></g></svg>
    <h1>TrailLink</h1>
    <p id="gateintro">TrailLink is invite-only. Enter the email your invite was sent to and we'll email you a 6-digit sign-in code.</p>
    <form id="gateform" class="form">
      <label>Email<input name="email" type="email" autocomplete="email" required placeholder="you@example.com"></label>
      <div class="btns"><button class="primary">Email me a code</button></div>
    </form>
    <form id="gatecode" class="form" hidden>
      <label>6-digit code from the email<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,8}" maxlength="8" required placeholder="123456" class="codeinput"></label>
      <div class="btns"><button type="button" id="gateback">Different email</button><button class="primary">Sign in</button></div>
    </form>
    <p id="gatemsg" class="quiet" role="status"></p>
  </div>
</div>
<div id="sheet" class="overlay" hidden><div class="dialog" role="dialog" aria-modal="true" id="sheet-body"></div></div>
<script type="module" src="./src/main.ts"></script>
<script>
  // If the app's code didn't start (for example a half-updated download), offer a clean reload instead of a blank screen.
  setTimeout(function () {
    if (window.__tlStarted) return;
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;left:12px;right:12px;top:40%;z-index:99;background:#1F4D3A;color:#fff;padding:16px;border-radius:14px;font:600 15px/1.35 system-ui;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.4)';
    d.innerHTML = 'TrailLink didn\'t finish loading.<br><button style="margin-top:10px;min-height:44px;padding:0 18px;border:0;border-radius:12px;background:#E8501A;color:#fff;font:700 15px system-ui">Reload TrailLink</button>';
    d.querySelector('button').onclick = function () {
      var done = function () { location.reload(); };
      if (window.caches) caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k.indexOf('traillink-app-') === 0; }).map(function (k) { return caches.delete(k); })); }).then(done, done); else done();
    };
    document.body.appendChild(d);
  }, 6000);
</script>
</body>
</html>
